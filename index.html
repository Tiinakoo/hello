<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #0db7ed, #384d54);
        color: #1f2933;
      }

      .card {
        background: #ffffff;
        padding: 2.5rem 3rem;
        border-radius: 16px;
        text-align: center;
      }

      h1 {
        margin: 0.5rem;
        font-size: 2rem;
      }

      button {
        background: #1f2933;
        color: #ffffff;
        border: transparent;
        padding: 0.8rem 1.8rem;
        font-size: 1rem;
        font-weight: 600;
        border-radius: 999px;
        cursor: pointer;
      }

      button:hover {
        background: #393b3b;
      }

      #msg {
        margin: 1.5rem 0 0;
        min-height: 1.5rem;
        font-size: 1.25rem;
        font-weight: 600;
        color: #1c9d5b;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Hello from the other side!</h1>
      <button onclick="document.getElementById('msg').textContent = 'Success!'">
        Press me
      </button>
      <p id="msg"></p>
    </div>
  </body>
</html>
